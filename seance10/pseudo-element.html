<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Element</title>
    <style>
        p::before{
            content: "Note: ";
            font-weight: bold;
        }
        p::after{
            content: " ?";
            color:red;
        }
    </style>
</head>
<body>
    <p>ABC</p>
</body>
</html>
